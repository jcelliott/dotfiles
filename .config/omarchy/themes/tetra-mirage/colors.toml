# Tetra Mirage: Ayu Mirage (https://ayutheme.com/)
# Generated by ~/.config/omarchy/tetra/generate; edit that, not this file.
#
# Shades, orange and brown follow base24 Ayu Mirage from tinted-theming. Bright
# ANSI colours are Ayu's palette; normal ones are those darkened by 0.07 OKLCH
# lightness (red by 0.05, and bright red lightened by 0.02), the rule Ayu's own
# terminal themes use. Selection is Ayu's editor selection (#409fff at 25% over
# #242936), muted is Ayu's comment gray. Neutral shades (backgrounds,
# foregrounds, muted) and selection have half of Ayu's tint (OKLCH chroma
# halved, same lightness).
mode = "dark"

accent = "#ffcc66"
selection = "#394657"
muted = "#747b85"

background = "#22242a"
dark_background = "#1c1f24"
darker_background = "#191b20"
lighter_background = "#272930"

foreground = "#cbcac6"
dark_foreground = "#757a83"
light_foreground = "#d8d7d2"
bright_foreground = "#f3f4f4"

red = "#e1776a"
yellow = "#e7b64e"
orange = "#ffad66"
green = "#bfe768"
cyan = "#7ecfb5"
blue = "#5cb9e7"
magenta = "#c8a9e7"
brown = "#f27983"

bright_red = "#f98d7f"
bright_yellow = "#ffcd66"
bright_green = "#d5ff80"
bright_cyan = "#95e6cb"
bright_blue = "#73d0ff"
