# Tetra Mirage
# Generated by ~/.config/omarchy/tetra/generate; edit that, not this file.
#
# Tetra Dark placed on a ground of OKHSL lightness 13.5 for the background and
# 83.3 for the foreground. Every colour keeps Dark's OKHSL hue and saturation.
# Shades, muted and selection keep their position between background and
# foreground. Bright colours, orange and brown keep Dark's lightness distance
# from the background; normal colours are their bright colour darkened by
# Dark's step, held to 4.5:1. Selection sits opposite accent's OKHSL hue, 30%
# of the way from black to accent's lightness, and muted takes selection's hue
# and saturation.
mode = "dark"

accent = "#e6b450"
selection = "#2b3548"
muted = "#586886"

background = "#1f1f1f"
dark_background = "#1e1e1e"
darker_background = "#1a1a1a"
lighter_background = "#262626"

foreground = "#d0d0d0"
dark_foreground = "#b2b2b2"
light_foreground = "#d5d5d5"
bright_foreground = "#dcdcdc"

red = "#e67183"
yellow = "#e3be3b"
orange = "#ffac7a"
green = "#90da41"
cyan = "#93dedb"
blue = "#7cb6f8"
magenta = "#d0a5eb"
brown = "#f7c586"

bright_red = "#f78c9b"
bright_yellow = "#ffd33b"
bright_green = "#adef71"
bright_cyan = "#bef1ee"
bright_blue = "#a1cdff"
bright_magenta = "#e5bcff"
