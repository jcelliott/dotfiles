# Tetra Dark: Ayu Dark (https://ayutheme.com/)
# Generated by ~/.config/omarchy/tetra/generate; edit that, not this file.
#
# Shades, orange and brown follow base24 Ayu Dark from tinted-theming. Bright
# ANSI colours are Ayu's palette; normal ones are those darkened by 0.07 OKLCH
# lightness, the rule Ayu's own terminal themes use. Selection is Ayu's blue
# selection #1b3a5b, muted is Ayu's comment gray. Neutral shades (backgrounds,
# foregrounds, muted) and selection have half of Ayu's tint (OKLCH chroma
# halved, same lightness).
mode = "dark"

accent = "#e6b450"
selection = "#2b3a4a"
muted = "#5f656c"

background = "#0c0e11"
dark_background = "#0b0d10"
darker_background = "#070708"
lighter_background = "#15171c"

foreground = "#e3e1d8"
dark_foreground = "#bebdb9"
light_foreground = "#eae8e1"
bright_foreground = "#f1f0eb"

red = "#d75b63"
yellow = "#e79e3a"
orange = "#ff8f40"
green = "#94c230"
cyan = "#7ecfb5"
blue = "#40abe7"
magenta = "#bc90e7"
brown = "#e6b450"

bright_red = "#f07178"
bright_yellow = "#ffb454"
bright_green = "#aad94c"
bright_cyan = "#95e6cb"
bright_blue = "#59c2ff"
bright_magenta = "#d2a6ff"
