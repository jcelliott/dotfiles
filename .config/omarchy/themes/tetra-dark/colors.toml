# Tetra Dark
# Generated by ~/.config/omarchy/tetra/generate; edit that, not this file.
#
# Tetra Dark is the definition Mirage and Light are placed from. Shades, orange
# and brown start from the base24 source scheme from tinted-theming, bright
# colours from the source palette with normal ones 0.07 OKLCH lightness darker.
# Then the shades become neutral greys at the same OKLab lightness, and the
# hues sit 60 degrees apart in OKHSL from red at 12, brown after red with
# yellow and orange 20 degrees either side of it. Selection sits opposite
# accent's OKHSL hue, 30% of the way from black to accent's lightness, and
# muted takes selection's hue and saturation.
mode = "dark"

accent = "#e6b450"
selection = "#2b3548"
muted = "#556583"

background = "#0e0e0e"
dark_background = "#0d0d0d"
darker_background = "#070707"
lighter_background = "#171717"

foreground = "#e1e1e1"
dark_foreground = "#bdbdbd"
light_foreground = "#e8e8e8"
bright_foreground = "#f0f0f0"

red = "#d8586f"
yellow = "#cfac2e"
orange = "#ff8f42"
green = "#83c63b"
cyan = "#79cdca"
blue = "#5ca4f3"
magenta = "#c38de4"
brown = "#eeaf5b"

bright_red = "#f16e84"
bright_yellow = "#edc000"
bright_green = "#99dd58"
bright_cyan = "#92e4e0"
bright_blue = "#7ebbff"
bright_magenta = "#dba1ff"
