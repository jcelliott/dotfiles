# Tetra Light
# Generated by ~/.config/omarchy/tetra/generate; edit that, not this file.
#
# Tetra Dark placed on a ground of OKHSL lightness 96.8 for the background and
# 25.5 for the foreground. Every colour keeps Dark's OKHSL hue and saturation.
# Shades, muted and selection keep their position between background and
# foreground, with the sunk backgrounds below the background. Bright colours,
# orange and brown keep Dark's lightness distance from the background, at 60%
# on a light ground; normal colours are their bright colour darkened by Dark's
# step, held to 4.5:1. Selection sits opposite accent's OKHSL hue, 30% of the
# way from white to accent's lightness, and muted takes selection's hue and
# saturation.
mode = "light"

accent = "#e6b450"
selection = "#e7ebf3"
muted = "#91a0c0"

background = "#f6f6f6"
dark_background = "#f5f5f5"
darker_background = "#f0f0f0"
lighter_background = "#ededed"

foreground = "#3b3b3b"
dark_foreground = "#565656"
light_foreground = "#363636"
bright_foreground = "#303030"

red = "#c1465e"
yellow = "#7f6918"
orange = "#d56800"
green = "#4f7923"
cyan = "#336f6d"
blue = "#2272c2"
magenta = "#904bb6"
brown = "#ae7829"

bright_red = "#ec5e79"
bright_yellow = "#9a7c00"
bright_green = "#618f34"
bright_cyan = "#3b8683"
bright_blue = "#0088f3"
bright_magenta = "#bc1eff"
