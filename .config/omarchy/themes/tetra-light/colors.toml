# Tetra Light: Ayu Light (https://ayutheme.com/)
# Generated by ~/.config/omarchy/tetra/generate; edit that, not this file.
#
# Shades, orange and brown follow base24 Ayu Light from tinted-theming. Bright
# ANSI colours are Ayu's palette; normal ones are darkened in OKLCH lightness
# until they reach 4.5:1 contrast on the background (a fixed 0.07, as in tetra-
# dark, leaves these at 2.6-3.6:1; Ayu Light's own terminal theme uses the same
# colour for both). Selection is Ayu's editor selection (#035bd6 at 15% over
# #fcfcfc), muted is Ayu's comment gray. Neutral shades (backgrounds,
# foregrounds, muted) and selection have half of Ayu's tint (OKLCH chroma
# halved, same lightness). dark_background is Ayu Light's sunk surface and
# darker_background is that mixed 8% toward the foreground (Omarchy light
# themes darken these).
mode = "light"

accent = "#f29718"
selection = "#dde3ec"
muted = "#aeaeb0"

background = "#f8f9f9"
dark_background = "#eceeef"
darker_background = "#e1e3e4"
lighter_background = "#eeeff0"

foreground = "#5e6163"
dark_foreground = "#8d9195"
light_foreground = "#505254"
bright_foreground = "#424445"

red = "#c2484b"
yellow = "#a66300"
orange = "#fa8d3e"
green = "#557e00"
cyan = "#008361"
blue = "#0078b8"
magenta = "#8961b0"
brown = "#e6ba7e"

bright_red = "#f07171"
bright_yellow = "#eba400"
bright_green = "#86b300"
bright_cyan = "#4cbf99"
bright_blue = "#22a4e6"
bright_magenta = "#a37acc"
