# tmux configuration file
#set -g default-terminal "xterm-16color"
#set -g default-terminal "xterm-256color"
# use tmux-256color where its terminfo exists (missing on older systems and in
# macOS's built-in database)
set -g default-terminal "screen-256color"
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "tmux-256color"'

# outer terminal capabilities: truecolor, OSC 52 clipboard, and extended keys
# (lets e.g. Shift+Enter through to applications)
set -as terminal-overrides ",*:RGB"
set -as terminal-features ",*:clipboard"
set -as terminal-features ",xterm-kitty:extkeys,xterm-ghostty:extkeys"
# -q: these options don't exist on older tmux versions on remote hosts
set -gq extended-keys on
set -gq extended-keys-format csi-u

set -g default-shell $SHELL
set -g allow-passthrough on

# change prefix to C-a
set -g prefix C-a
# set -g prefix2 ^" "

# use C-a C-a to send prefix to an inner tmux session
# bind C-a send-prefix  # if inner uses the same prefix as current
bind C-a send-keys C-b  # most remote clients use the default C-b
bind a send-keys C-b

bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"
# open a new window immediately after the current window
bind C new-window -a -c "#{pane_current_path}"
# open a new window in my home directory
bind v new-window -c "~"
# open a new window with a "horizontal" split
bind b new-window \; split-window -h

bind n next-window
unbind C-n
bind -r C-n next-window
unbind m
bind -r m previous-window

# move original , binding to < and use , for last-window
unbind <
bind < command-prompt "rename-window '%%'"
unbind ,
bind , last-window
unbind '$'
bind '$' command-prompt "rename-session '%%'"

# unbind r
# bind r refresh-client \; display-message "..."

# reload config file
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded."

# clear pane history buffer
unbind R
bind R clear-history \; display-message "History cleared."

# vim style pane navigation
# use C+[hjkl] to move more than one pane in succession
unbind j
bind j select-pane -D
unbind C-j
bind -r C-j select-pane -D
unbind k
bind k select-pane -U
unbind C-k
bind -r C-k select-pane -U
unbind h
bind h select-pane -L
unbind C-h
bind -r C-h select-pane -L
unbind l
bind l select-pane -R
unbind C-l
bind -r C-l select-pane -R

# smart pane switching with awareness of vim splits
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
# bind -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# replace clear screen (C-l)
unbind -n 'C-\'
# bind -n C-\ send-keys 'C-l'
bind 'C-\' send-keys 'C-l'

# Fuzzy window switching (pipeline in ~/.tmux/bin/tmux-window-switch.sh)
bind-key Enter display-popup -E -w 70% -h 30% "~/.tmux/bin/tmux-window-switch.sh"

# move panes
bind C-f command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind C-t command-prompt -p "send pane to:"  "join-pane -t '%%'"
bind S display-panes \;\
             command-prompt -p "swap pane from:, swap pane to:" "swap-pane -s '%%' -t '%%'"

# move windows
unbind M
bind -r M swap-window -t -1
unbind N
bind -r N swap-window -t +1
bind C-w command-prompt -p "send window to:" "move-window -t '%%'"

# vim style copy-paste
set -g mode-keys vi
bind Escape copy-mode
unbind p
bind p paste-buffer
bind -T copy-mode-vi 'v' send -X begin-selection
# copies also go to the system clipboard through the terminal (OSC 52, see
# set-clipboard), which works locally and over ssh
bind -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# C-v: paste from the system clipboard
bind C-v run "(wl-paste -n 2>/dev/null || pbpaste) | tmux load-buffer - && tmux paste-buffer"

# make tmux command prompt nicer
set -g status-keys emacs # because I want escape to exit the command prompt
unbind \;
bind \; command-prompt -p ">"
# make choice mode nicer
# bind -t vi-choice Escape cancel

# bottom in a new window (https://github.com/ClementTsang/bottom)
bin '`' new-window btm
# htop in a new split
bind '\' split-window -v -p 50 "htop"

# don't wait for an escape sequence (for vim)
# set -sg escape-time 0
# that was causing escape sequences to be printed when attaching to a tmux session
set -sg escape-time 10

# wait one second for repeat commands
set -g repeat-time 1000

# send copies to the system clipboard via the outer terminal (OSC 52), and let
# applications inside tmux (including a nested tmux over ssh) do the same
set -g set-clipboard on

# pass focus in/out events to applications (vim autoread etc.)
set -g focus-events on

# when a session is destroyed, switch to another one instead of detaching
set -g detach-on-destroy off

# leave output of applications (like less) on the screen after exiting
# set-window-option -g alternate-screen off

# enable all mouse functionality (new in tmux 2.1)
set -g mouse on

set -g history-limit 50000
set -g message-limit 100
set -g aggressive-resize on

# Appearance
set -g base-index 1
set -g renumber-windows on
set -g pane-base-index 1
set -g set-titles on
set -g set-titles-string "#h - #S - #W"
set -g automatic-rename on
# set -g monitor-activity on
# set -g activity-action any
# set -g monitor-bell on
# set -g visual-bell on
# set -g visual-activity on
set -g display-time 1500
set -g display-panes-time 1500
# Colors come from the terminal's palette so they follow the theme: named ANSI
# colors, plus base16-style shades in colour16-21 (colour18 = lighter
# background, colour19 = selection), set by the foot/Ghostty theme configs
set -g message-command-style bg=colour19,fg=default
set -g message-style bg=colour19,fg=default
set -g mode-style bg=colour19,fg=default

# set -g pane-active-border-style bg=default,fg=green
set -g pane-active-border-style bg=green,fg=default
set -g pane-border-lines heavy
set -g pane-border-indicators both

# Statusline
set -g status-position bottom
set -g status-style bg=colour18,fg=default
set -g window-status-current-style  bg=green # active window
set -g window-status-activity-style bg=default,fg=yellow
set -g window-status-bell-style     bg=black,fg=red
set -g window-status-last-style     fg=green
set -g window-status-separator      ' | '
set -g status-left-length           16
set -g status-left                  "#{?client_prefix,#[fg=red],}[#S]#[default] "
set -g status-right-length          80
set -g status-right                 "#[fg=blue]#{?pane_in_mode,COPY ,}#{?window_zoomed_flag,ZOOM ,}#[default][#h]"


# Window status format:
  #   #I              - window index
  #   #W              - window name
  #   @claude_status conditional coloring:
  #     ⏸(pause)     - red    (waiting for input)
  #     ⏹︎(stop)      - green  (done)
  #     ▶ (play)      - yellow (working, default)
  #   Window flags (only zoomed and bell):
  #     Z             - a pane is zoomed
  #     !             - bell rang in window
  #     #             - activity detected in window
# set -g window-status-format '#I:#W#{?@claude_status,#{?#{==:#{@claude_status},⏸},#[fg=red],#{?#{==:#{@claude_status},⏹︎},#[fg=green],#[fg=yellow]}} #{@claude_status}#[default] ,}#{?window_zoomed_flag,Z,}#{?window_bell_flag,!,}#{?window_activity_flag,#,}'
# # Don't use separate colors for current window, and only need to show zoomed flag
# set -g window-status-current-format '#I:#W#{?@claude_status, #{@claude_status} ,}#{?window_zoomed_flag,Z,}'

# Environment
# See https://github.com/agriffis/weechat-tmux-env
# set -g update-environment 'DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY DBUS_SESSION_BUS_ADDRESS'

### Workmux
# https://github.com/raine/workmux
# run-shell resolves #{pane_id} before the popup opens, then injects it as
# $TMUX_PANE. A display-popup otherwise has no $TMUX_PANE, which is how workmux
# scopes --session; without it the dashboard silently shows every session.
bind Tab run-shell "tmux display-popup -h 50 -w 116 -e TMUX_PANE=#{pane_id} -E 'workmux dashboard --session'"

### Plugins

# tpm plugins (fetch with prefix + I)
set -g @plugin 'tmux-plugins/tpm'
# save: prefix + ctrl-s
# restore: prefix + ctrl-r
set -g @plugin 'tmux-plugins/tmux-resurrect'

# # sidebar with directory tree: prefix+tab
# set -g @plugin 'tmux-plugins/tmux-sidebar'
#   set -g @sidebar-tree-command 'tree -C' # colors

set -g @plugin 'nhdaly/tmux-scroll-copy-mode'
  set -g @scroll-without-changing-pane 'on'
  set -g @scroll-speed-num-lines-per-scroll 1
  set -g @emulate-scroll-for-no-mouse-alternate-buffer 'on'

set -g @plugin 'tmux-plugins/tmux-logging'
  set -g @save-complete-history-key 'H'

set -g @plugin 'Morantron/tmux-fingers'
  set -g @fingers-key f

set -g @plugin 'sainnhe/tmux-fzf'
  TMUX_FZF_LAUNCH_KEY="g"
  TMUX_FZF_OPTIONS="-p -w 80% -h 40% -m"
  # TMUX_FZF_MENU_POPUP_WIDTH="90%"

# Initializes TMUX plugin manager.
# Keep this line at the very bottom of tmux.conf.
run-shell '~/.tmux/plugins/tpm/tpm'
